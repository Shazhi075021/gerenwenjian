<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to me</title>
    <style>
        html {
            scroll-behavior: smooth; /* 全局平滑滚动 */
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            color: #222222;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        /* 顶部导航 */
        header {
            padding: 30px 0;
            text-align: center;
        }
        .logo {
            font-size: 22px;
            letter-spacing: 4px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        nav ul {
            display: flex;
            gap: 24px;
            justify-content: center;
            list-style: none;
            flex-wrap: wrap;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #2558ff;
        }

        /* 首屏英雄区 Hero */
        #hero {
            text-align: center;
            padding: 20px 0 60px;
        }
        .hero-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
            position: relative;
        }
        .hero-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }
        .brush-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2558ff;
            font-size: 48px;
            font-style: italic;
            font-weight: bold;
        }

        /* 板块通用 */
        section {
            padding: 70px 0;
        }
        .section-title {
            text-align: center;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        /* 精选内容网格 */
        #gallery .grid-row-1 {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 14px;
            margin-bottom: 50px;
        }
        .grid-col-left {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 14px;
        }
        .grid-item {
            background: #eee;
            overflow: hidden;
        }
        .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
        }
        .blue-block {
            background-color: #2558ff;
        }

        /* 单品板块 */
        #product {
            text-align: center;
        }
        .skate-item {
            width: 90px;
            margin: 0 auto 20px;
        }
        .skate-item img {
            width: 100%;
        }

        /* 内容三列网格 */
        #blog .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            text-align: center;
        }
        .card-img {
            width: 100%;
            height: 180px;
            background: #eee;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }
        .card p {
            font-size: 12px;
            color: #555;
            padding: 0 8px;
        }

        /* 底部深色footer */
        footer {
            background: #222222;
            color: #fff;
            padding: 60px 0;
            margin-top: 40px;
        }
        .footer-wrap {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        .footer-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            font-size: 11px;
            gap: 10px;
        }
        .footer-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            filter: grayscale(100%);
            z-index: 0;
        }
        .footer-inner {
            position: relative;
            z-index: 2;
        }
        .thank-text {
            color: #2558ff;
            font-size: 40px;
            font-style: italic;
            text-align: right;
        }
        .newsletter {
            margin-top: 20px;
        }
        input {
            padding: 8px;
            width: 240px;
        }
        button {
            padding: 8px 14px;
            background: #2558ff;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* 响应式适配手机 */
        @media(max-width : 991px ){
            #gallery .grid-row-1 {
                grid-template-columns: 1fr;
            }
            #blog .grid-3 {
                grid-template-columns: 1fr;
            }
            .footer-wrap {
                grid-template-columns: 1fr;
            }
            .footer-menu {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<div id="floatTip" style="
  position: fixed;
  left: 50%;

<script>
function showThanks(){
  const inputVal = document.getElementById('emailInput').value.trim();
  // 判断：只要输入了字符就触发
  if(inputVal !== ''){
    const tip = document.getElementById('floatTip');
    tip.style.opacity = "1";
    tip.style.transform = "translate(-50%, -80%)";
    // 2秒后消失
    setTimeout(()=>{
      tip.style.opacity = "0";
      tip.style.transform = "translate(-50%, -50%)";
    }, 2000)
  }
}
</script>
